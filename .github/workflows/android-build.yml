
name: Build ArchiAI Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.13

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build Debug APK
        run: |
          ./gradlew --no-daemon assembleDebug --stacktrace --info

      - name: Save Manifest diagnostic report
        if: always()
        run: |
          find app/build/outputs/logs -type f -name '*manifest*' -print -exec cat {} \; || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ArchiAI-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
